[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specshift"
version = "1.0.0"
description = "OpenAPI ve Swagger sozlesmelerindeki kirici degisiklikleri tespit eden, siniflandiran ve isteğe bagli AI ile ozetleyen CLI araci"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lethe044" }]
keywords = [
    "openapi",
    "swagger",
    "api",
    "breaking-changes",
    "contract-testing",
    "api-diff",
    "devtools",
    "cli",
    "ci-cd",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
pretty = ["rich>=13.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "responses>=0.23", "rich>=13.0"]

[project.urls]
Homepage = "https://github.com/Lethe044/specshift"
Repository = "https://github.com/Lethe044/specshift"
Issues = "https://github.com/Lethe044/specshift/issues"
Changelog = "https://github.com/Lethe044/specshift/blob/main/CHANGELOG.md"

[project.scripts]
specshift = "specshift.cli:main"

[tool.setuptools.packages.find]
include = ["specshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
