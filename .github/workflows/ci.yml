name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=specshift --cov-report=term-missing

      - name: Smoke test the CLI
        run: |
          specshift --version
          specshift diff examples/old_api.yaml examples/new_api.yaml --format json --fail-on none
          specshift diff-graphql examples/old_schema.graphql examples/new_schema.graphql --format json --fail-on none
          specshift diff examples/old_api.yaml examples/new_api.yaml --format html --output /tmp/report.html --fail-on none

  self-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Check example specs for breaking changes against main
        run: |
          specshift diff examples/old_api.yaml examples/new_api.yaml --format markdown --fail-on none
