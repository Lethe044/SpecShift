name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=specshift --cov-report=term-missing

      - name: Smoke test the CLI
        run: |
          specshift --version
          specshift diff examples/old_api.yaml examples/new_api.yaml --format json --fail-on none
          specshift diff-graphql examples/old_schema.graphql examples/new_schema.graphql --format json --fail-on none
          specshift diff-proto examples/old_service.proto examples/new_service.proto --format json --fail-on none
          specshift lint examples/old_api.yaml --format json --fail-on none
          specshift lint-graphql examples/old_schema.graphql --format json --fail-on none
          specshift lint-proto examples/old_service.proto --format json --fail-on none
          mkdir -p /tmp/dir-old /tmp/dir-new
          cp examples/old_api.yaml /tmp/dir-old/api.yaml
          cp examples/old_schema.graphql /tmp/dir-old/schema.graphql
          cp examples/old_service.proto /tmp/dir-old/service.proto
          cp examples/new_api.yaml /tmp/dir-new/api.yaml
          cp examples/new_schema.graphql /tmp/dir-new/schema.graphql
          cp examples/new_service.proto /tmp/dir-new/service.proto
          specshift diff-dir /tmp/dir-old /tmp/dir-new --format json --fail-on none
          specshift diff examples/old_api.yaml examples/new_api.yaml --format html --output /tmp/report.html --fail-on none
          specshift diff examples/old_api.yaml examples/new_api.yaml --format sarif --output /tmp/report.sarif --fail-on none

      - name: Smoke test the changelog command
        run: |
          git init -q /tmp/changelog-smoke
          cp examples/old_api.yaml /tmp/changelog-smoke/openapi.yaml
          cd /tmp/changelog-smoke
          git -c user.email=ci@example.com -c user.name=ci add .
          git -c user.email=ci@example.com -c user.name=ci commit -q -m "v1"
          git tag v1.0.0
          cp "$GITHUB_WORKSPACE/examples/new_api.yaml" openapi.yaml
          specshift changelog openapi.yaml --output CHANGELOG-API.md
          grep -q "v1.0.0" CHANGELOG-API.md

      - name: Smoke test the local dashboard
        run: |
          specshift serve --port 8787 --no-browser &
          SERVER_PID=$!
          sleep 2
          curl -sf http://127.0.0.1:8787/ > /dev/null
          kill $SERVER_PID

  self-check:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Check example specs for breaking changes against main
        run: |
          specshift diff examples/old_api.yaml examples/new_api.yaml --format markdown --fail-on none
