openapi: 3.0.3
info:
  title: Bookstore API
  version: 1.0.0
servers:
  - url: https://api.bookstore.example.com/v1
paths:
  /books:
    get:
      summary: Kitap listesini getirir
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Basarili
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      summary: Yeni kitap ekler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: Olusturuldu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
  /books/{bookId}:
    get:
      summary: Tek bir kitabi getirir
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Basarili
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "404":
          description: Bulunamadi
    delete:
      summary: Kitabi siler
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Silindi
components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [available, reserved, sold]
    BookInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        author:
          type: string
        price:
          type: number
